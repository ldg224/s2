<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Match Centre | HCL S2</title>
    <link rel="icon" type="image/png" href="league_files/Season 2 Logo (PRIMARY).png">

    <style>
        /* === SEASON 2 THEME VARIABLES === */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap');

        :root {
            --bg-main: #0f1115;
            --grid-color: rgba(255, 255, 255, 0.03);
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --font-family: 'Inter', system-ui, -apple-system, sans-serif;
            --glass-bg: rgba(20, 22, 27, 0.85);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            --card-grad: linear-gradient(180deg, rgba(18, 20, 26, 0.95), rgba(14, 16, 22, 0.94));
            
            --pitch-green: #0a1f11;
            --pitch-lines: rgba(255, 255, 255, 0.15);
            
            --status-upcoming: #e6a734e8;
            --status-finalised: #34d399;
            --status-live: #10b981;
        }

        body {
            font-family: var(--font-family);
            font-weight: 500;
            margin: 0; padding: 0;
            color: var(--text-main);
            background-color: var(--bg-main);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        *, *::before, *::after { box-sizing: border-box; }

        .grid-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1;
            background-image: 
                linear-gradient(to right, var(--grid-color) 1px, transparent 1px),
                linear-gradient(to bottom, var(--grid-color) 1px, transparent 1px);
            background-size: 32px 32px;
            pointer-events: none;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .app-container {
            max-width: 1000px; margin: 0 auto;
            padding: 40px 20px calc(40px + env(safe-area-inset-bottom));
            display: flex; flex-direction: column; gap: 32px;
        }

        nav { display: flex; align-items: center; width: 100%; z-index: 10; }
        .back-link {
            text-decoration: none; color: var(--text-muted); font-size: 0.9rem;
            font-weight: 700; display: inline-flex; align-items: center; gap: 6px;
            transition: color 0.2s ease;
            background: var(--glass-bg); padding: 10px 18px; border-radius: 999px; border: 1px solid var(--glass-border);
        }
        .back-link:hover { color: var(--text-main); background: rgba(255, 255, 255, 0.05); }

        .dash-widget {
            background: var(--card-grad); backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border); border-radius: 28px;
            padding: 24px; box-shadow: 0 26px 55px rgba(0, 0, 0, 0.15);
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
            position: relative; overflow: hidden;
        }

        /* Scoreboard Header */
        .scoreboard-outer-card {
            display: grid; grid-template-columns: 1fr auto 1fr; 
            align-items: center; gap: 20px; padding: 40px 30px;
        }
        .scoreboard-bg-gradient {
            position: absolute; inset: 0; pointer-events: none; z-index: 0; opacity: 0.15;
        }
        .team-side { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
        .team-logo-lg { width: 90px; height: 90px; object-fit: contain; filter: drop-shadow(0 8px 16px rgba(0,0,0,0.4)); }
        .team-name-lg { font-size: 1.8rem; font-weight: 900; letter-spacing: -0.5px; margin: 0; line-height: 1.1; }
        .team-manager-sm { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; margin: 0; text-transform: uppercase; letter-spacing: 0.5px; }
        .team-ladder-rank { font-size: 0.78rem; font-weight: 800; background: rgba(255,255,255,0.06); padding: 4px 12px; border-radius: 6px; margin-top: 4px; border: 1px solid var(--glass-border); }
        
        .score-center-block { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .score-row { font-size: 4rem; font-weight: 900; letter-spacing: -1px; line-height: 1; text-shadow: 0 4px 20px rgba(0,0,0,0.4); }
        .match-meta-badge { font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.8px; padding: 6px 16px; border-radius: 20px; border: 1px solid currentColor; background: rgba(0,0,0,0.3); }
        .match-meta-badge.finalised { color: var(--status-finalised); box-shadow: 0 0 10px rgba(52, 211, 153, 0.2); }
        .match-meta-badge.upcoming { color: var(--status-upcoming); box-shadow: 0 0 10px rgba(230, 167, 52, 0.2); }
        .match-meta-badge.live { color: var(--status-live); box-shadow: 0 0 10px rgba(16, 185, 129, 0.2); }
        .match-time-label { font-size: 0.85rem; font-weight: 700; color: var(--text-muted); }

        /* Win Predictor Strip */
        .predictor-labels { display: flex; justify-content: space-between; font-size: 0.75rem; font-weight: 800; margin-bottom: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .predictor-track-combined { height: 14px; background: rgba(0,0,0,0.4); border-radius: 8px; display: flex; overflow: hidden; border: 1px solid var(--glass-border); }
        .predictor-segment { height: 100%; display: flex; align-items: center; justify-content: center; font-size: 0.65rem; font-weight: 800; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }

        /* Media / Youtube */
        .media-player-wrapper {
            position: relative; width: 100%; padding-bottom: 56.25%; border-radius: 16px; overflow: hidden; background: #000; border: 1px solid var(--glass-border); box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin-bottom: 10px;
        }
        .media-player-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        
        .section-title { font-size: 1.1rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin: 0 0 16px 0; border-bottom: 1px solid var(--glass-border); padding-bottom: 10px; }

        /* Pitch Overhaul */
        .field-grand-wrapper {
            background-color: var(--pitch-green);
            border: 1px solid var(--glass-border); border-radius: 20px;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.6); display: flex; flex-direction: column; overflow: hidden; position: relative;
        }
        .pitch-container-horizontal {
            background-image: linear-gradient(90deg, rgba(255,255,255,0.03) 50%, transparent 50%);
            background-size: 60px 100%; height: 420px; position: relative; display: flex; flex-direction: row; width: 100%;
        }
        
        .pitch-center-line-vert { position: absolute; left: 50%; top: 0; height: 100%; width: 2px; background: var(--pitch-lines); transform: translateX(-50%); }
        .pitch-center-circle-middle { position: absolute; top: 50%; left: 50%; width: 120px; height: 120px; border: 2px solid var(--pitch-lines); border-radius: 50%; transform: translate(-50%, -50%); }
        .pitch-center-spot { position: absolute; top: 50%; left: 50%; width: 6px; height: 6px; background: var(--pitch-lines); border-radius: 50%; transform: translate(-50%, -50%); }
        
        .pitch-penalty-box-left { position: absolute; left: 0; top: 50%; height: 220px; width: 85px; border: 2px solid var(--pitch-lines); border-left: 0; transform: translateY(-50%); }
        .pitch-goal-box-left { position: absolute; left: 0; top: 50%; height: 100px; width: 30px; border: 2px solid var(--pitch-lines); border-left: 0; transform: translateY(-50%); }

        .pitch-penalty-box-right { position: absolute; right: 0; top: 50%; height: 220px; width: 85px; border: 2px solid var(--pitch-lines); border-right: 0; transform: translateY(-50%); }
        .pitch-goal-box-right { position: absolute; right: 0; top: 50%; height: 100px; width: 30px; border: 2px solid var(--pitch-lines); border-right: 0; transform: translateY(-50%); }

        .pitch-team-half { width: 50%; height: 100%; position: relative; display: flex; flex-direction: row; justify-content: space-around; align-items: center; box-sizing: border-box; padding: 20px 45px; z-index: 2; }
        .pitch-team-half.home-left-side { flex-direction: row; }
        .pitch-team-half.away-right-side { flex-direction: row-reverse; }

        .pitch-column-band { display: flex; flex-direction: column; justify-content: center; gap: 32px; height: 100%; align-items: center; flex-grow: 1; }

        .player-node { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 70px; }
        .player-badge { position: relative; width: 34px; height: 34px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.8); display: flex; align-items: center; justify-content: center; font-size: 0.85rem; font-weight: 800; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
        .player-name-tag { font-size: 0.68rem; font-weight: 700; color: #fff; background: rgba(15, 17, 21, 0.9); padding: 4px 8px; border-radius: 6px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 85px; border: 1px solid rgba(255,255,255,0.1); }
        
        .goal-stack { position: absolute; bottom: -8px; right: -10px; display: flex; flex-direction: row; z-index: 5; }
        .goal-icon { width: 16px; height: 16px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; margin-left: -6px; border: 1px solid #111; color: #000; }
        .goal-icon:first-child { margin-left: 0; }
        .captain-icon { position: absolute; top: -8px; right: -8px; background: #fbbf24; color: #000; font-size: 0.6rem; font-weight: 900; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid #000; z-index: 5; }

        /* Integrated Bottom Performance Matrix Panel */
        .integrated-performance-hud {
            background: rgba(0, 0, 0, 0.4); border-top: 1px solid var(--glass-border);
            padding: 20px 28px; display: grid; grid-template-columns: 1fr 1fr; gap: 45px; position: relative; z-index: 3;
        }
        .stat-labels { display: flex; justify-content: space-between; font-size: 0.72rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-labels span.stat-val-highlight { color: var(--text-main); font-size: 0.85rem; font-weight: 900; }
        .stat-split-track { height: 8px; background: rgba(255,255,255,0.05); border-radius: 4px; display: flex; overflow: hidden; margin-top: 6px; }

        /* Events Timeline */
        .timeline-container { position: relative; padding: 20px 0; }
        .timeline-line { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: var(--glass-border); transform: translateX(-50%); }
        .timeline-event { display: flex; width: 100%; justify-content: space-between; align-items: center; margin-bottom: 20px; position: relative; z-index: 2; }
        .timeline-event.home-event { flex-direction: row; }
        .timeline-event.away-event { flex-direction: row-reverse; }
        .timeline-half { width: 45%; display: flex; align-items: center; gap: 12px; }
        .timeline-event.home-event .timeline-half { justify-content: flex-end; text-align: right; }
        .timeline-event.away-event .timeline-half { justify-content: flex-start; text-align: left; }
        .timeline-empty-half { width: 45%; }
        .timeline-center-icon { width: 28px; height: 28px; background: var(--bg-main); border: 1px solid var(--glass-border); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; z-index: 2; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .event-minute { font-weight: 900; font-size: 0.85rem; padding: 4px 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); }
        .event-player { font-weight: 700; font-size: 0.95rem; }

        /* Squad Roster Tables */
        .roster-lists { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        .roster-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        .roster-table th { text-align: left; padding: 12px 8px; color: var(--text-muted); border-bottom: 1px solid var(--glass-border); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; }
        .roster-table td { padding: 12px 8px; border-bottom: 1px solid rgba(255,255,255,0.03); font-weight: 600; }
        .roster-table tr:last-child td { border-bottom: 0; }

        @media (max-width: 768px) {
            .scoreboard-outer-card { grid-template-columns: 1fr; padding: 30px 20px; gap: 25px; }
            .score-center-block { order: -1; }
            .field-grand-wrapper { overflow-x: auto; }
            .pitch-container-horizontal { min-width: 700px; }
            .roster-lists { grid-template-columns: 1fr; }
            .timeline-line { left: 24px; transform: none; }
            .timeline-event.home-event, .timeline-event.away-event { flex-direction: row; }
            .timeline-half { width: calc(100% - 40px); justify-content: flex-start !important; text-align: left !important; margin-left: 45px; }
            .timeline-empty-half { display: none; }
            .timeline-center-icon { position: absolute; left: 10px; }
        }
    </style>
</head>
<body>

    <div class="grid-bg"></div>

    <div class="app-container">
        <nav>
            <a href="index.html" class="back-link">← Back to Match Portal</a>
        </nav>

        <main id="app-mount">
            <div style="text-align:center; padding: 60px 0; color: var(--text-muted); font-weight: 600;">Processing Tactical Data Streams...</div>
        </main>
    </div>

    <script>
        const CSV_SCHEDULE = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRWLzMxExK_CHV8x6uGcYFuDTKIaIfQIFMMrDz89AbrbBtgt4E22U8lmMyr-p3F-_cZcGPmm1qJSSYN/pub?gid=242746494&single=true&output=csv";
        const CSV_STANDINGS = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRWLzMxExK_CHV8x6uGcYFuDTKIaIfQIFMMrDz89AbrbBtgt4E22U8lmMyr-p3F-_cZcGPmm1qJSSYN/pub?gid=492816603&single=true&output=csv";
        const CSV_TEAMS = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRWLzMxExK_CHV8x6uGcYFuDTKIaIfQIFMMrDz89AbrbBtgt4E22U8lmMyr-p3F-_cZcGPmm1qJSSYN/pub?gid=0&single=true&output=csv";
        const CSV_ROSTERS = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRWLzMxExK_CHV8x6uGcYFuDTKIaIfQIFMMrDz89AbrbBtgt4E22U8lmMyr-p3F-_cZcGPmm1qJSSYN/pub?gid=1346726150&single=true&output=csv";

        const TEAM_ASSETS = {
            'LFC': { primary: 'team_files/s2_lucky_fc_lfc_logo_main.png' },
            'SKS': { primary: 'team_files/s2_sks_fc_sks_logo_main.png' },
            'CFC': { primary: 'team_files/s2_cranbourne_united_fc_cfc_logo_main.png' },
            'TUR': { primary: 'team_files/s2_fc_turtle_tur_logo_main.png' },
            'TEAM5': { primary: 'team_files/s2_team5_logo_main.png' },
            'NGR': { primary: 'team_files/s2_tyrone_fc_ngr_logo_main.png' }
        };

        function getContrastYIQ(hexcolor){
            if (!hexcolor) return '#0f1115';
            hexcolor = hexcolor.replace("#", "");
            if (hexcolor.length === 3) hexcolor = hexcolor.split('').map(x => x + x).join('');
            const r = parseInt(hexcolor.substr(0,2),16) || 0;
            const g = parseInt(hexcolor.substr(2,2),16) || 0;
            const b = parseInt(hexcolor.substr(4,2),16) || 0;
            const yiq = ((r*299)+(g*587)+(b*114))/1000;
            return (yiq >= 128) ? '#0f1115' : '#ffffff';
        }

        function parseYouTubeEmbed(url) {
            if (!url || typeof url !== 'string') return null;
            let videoId = null;
            try {
                if (url.includes('v=')) videoId = url.split('v=')[1]?.split('&')[0];
                else if (url.includes('youtu.be/')) videoId = url.split('youtu.be/')[1]?.split('?')[0];
                else if (url.includes('embed/')) videoId = url.split('embed/')[1]?.split('?')[0];
            } catch (e) { return null; }
            return videoId ? `https://www.youtube.com/embed/${videoId}` : null;
        }

        async function fetchCSV(url) {
            const res = await fetch(url);
            const text = await res.text();
            return text.split(/\r\n|\n/).map(line => {
                let result = []; let current = ''; let inQuotes = false;
                for (let i = 0; i < line.length; i++) {
                    let char = line[i];
                    if (char === '"') inQuotes = !inQuotes;
                    else if (char === ',' && !inQuotes) { result.push(current.trim()); current = ''; }
                    else current += char;
                }
                result.push(current.trim());
                return result;
            });
        }

        function buildRosterTable(players) {
            if(!players || players.length === 0) return `<p style="font-size:0.85rem; color:var(--text-muted); font-style:italic;">Roster data unassigned.</p>`;
            return `
                <table class="roster-table">
                    <thead><tr><th>#</th><th>Name</th><th>Pos</th><th>Off</th><th>Def</th></tr></thead>
                    <tbody>
                        ${players.map(p => `
                            <tr>
                                <td style="color:var(--text-muted); font-family:monospace;">${p.num}</td>
                                <td>${p.name}</td>
                                <td style="color:var(--text-muted); font-size:0.75rem;">${p.pos}</td>
                                <td style="color:#34d399;">${p.off}</td>
                                <td style="color:#60a5fa;">${p.def}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        function buildHorizontalPitchNodes(players, teamHex, textColor) {
            const lines = { 'GK': [], 'DEF': [], 'MID': [], 'FWD': [] };
            players.forEach(p => { if (p && p.pos && lines[p.pos]) lines[p.pos].push(p); });
            const order = ['GK', 'DEF', 'MID', 'FWD'];
            return order.map(posKey => `
                <div class="pitch-column-band">
                    ${lines[posKey].map(p => {
                        const nameParts = p.name ? p.name.trim().split(' ') : ['Unknown'];
                        let goalIcons = '';
                        if (p.goals > 0) {
                            goalIcons = '<div class="goal-stack">';
                            for(let g=0; g<p.goals; g++) goalIcons += '<span class="goal-icon">⚽</span>';
                            goalIcons += '</div>';
                        }
                        let captainHtml = p.isCaptain ? '<div class="captain-icon">C</div>' : '';

                        return `
                            <div class="player-node">
                                <div class="player-badge" style="background-color: ${teamHex}; color: ${textColor};">
                                    ${p.num}
                                    ${goalIcons}
                                    ${captainHtml}
                                </div>
                                <div class="player-name-tag">${nameParts[nameParts.length - 1]}</div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `).join('');
        }

        async function bootApp() {
            try {
                const params = new URLSearchParams(window.location.search);
                const queryWeek = params.get('week');
                const queryHome = params.get('home');
                const queryAway = params.get('away');

                if (!queryWeek || !queryHome || !queryAway) {
                    throw new Error("Missing tactical URL routing parameters.");
                }

                const [scheduleRaw, rosterRaw, standingsRaw, teamsRaw] = await Promise.all([
                    fetchCSV(CSV_SCHEDULE), fetchCSV(CSV_ROSTERS), fetchCSV(CSV_STANDINGS), fetchCSV(CSV_TEAMS)
                ]);

                // Map Core Team Meta
                let teamsMap = {};
                teamsRaw.forEach((row, i) => {
                    if (i === 0 || !row || !row[0]) return;
                    teamsMap[row[1].trim().toUpperCase()] = {
                        name: row[0].trim(),
                        code: row[1].trim().toUpperCase(),
                        manager: row[2] ? row[2].trim() : 'TBA',
                        hex: row[3] ? row[3].trim() : '#475569',
                        rank: 'N/A', points: 0
                    };
                });

                // Map Standings
                standingsRaw.forEach((row, i) => {
                    if (i === 0 || !row || !row[1]) return;
                    let tName = row[1].trim().toUpperCase();
                    let tCode = null;
                    Object.keys(teamsMap).forEach(k => { if(teamsMap[k].name.toUpperCase() === tName) tCode = k; });
                    if(tCode) {
                        teamsMap[tCode].rank = row[0];
                        teamsMap[tCode].points = parseInt(row[9]) || 0;
                    }
                });

                // Retrieve Specific Match
                let targetMatch = scheduleRaw.find(row => {
                    if(!row || !row[4] || !row[6]) return false;
                    const rWeek = row[0].trim();
                    const rHomeName = row[4].trim().toUpperCase();
                    const rAwayName = row[6].trim().toUpperCase();
                    
                    let rHomeCode = Object.keys(teamsMap).find(k => teamsMap[k].name.toUpperCase() === rHomeName) || rHomeName;
                    let rAwayCode = Object.keys(teamsMap).find(k => teamsMap[k].name.toUpperCase() === rAwayName) || rAwayName;
                    
                    return (rWeek === queryWeek && rHomeCode === queryHome && rAwayCode === queryAway);
                });

                if (!targetMatch) throw new Error("Match signature not found in central database.");

                const hCode = queryHome;
                const aCode = queryAway;
                const hMeta = teamsMap[hCode] || { name: targetMatch[4], hex: '#3b82f6', manager: 'TBA', rank: 'N/A', points: 0 };
                const aMeta = teamsMap[aCode] || { name: targetMatch[6], hex: '#ef4444', manager: 'TBA', rank: 'N/A', points: 0 };
                
                const hLogoUrl = (TEAM_ASSETS[hCode] && TEAM_ASSETS[hCode].primary) ? TEAM_ASSETS[hCode].primary : '';
                const aLogoUrl = (TEAM_ASSETS[aCode] && TEAM_ASSETS[aCode].primary) ? TEAM_ASSETS[aCode].primary : '';

                const matchStatus = (targetMatch[3] || '').trim().toUpperCase();
                let statusClass = 'upcoming';
                let isFinalised = false;
                if(matchStatus.includes("FINALISED")) { statusClass = 'finalised'; isFinalised = true; }
                else if(matchStatus.includes("ACTIVE")) statusClass = 'live';

                let ytEmbed = parseYouTubeEmbed(targetMatch[8]);

                // Map Rosters
                let hRoster = [], aRoster = [];
                let hStats = { off:0, def:0, count:0 }, aStats = { off:0, def:0, count:0 };

                rosterRaw.forEach((row, i) => {
                    if (i === 0 || !row || !row[0]) return;
                    let assigned = row[3] ? row[3].trim().toUpperCase() : '';
                    if(!assigned) return;

                    let regexVal = /\((\d+)\)/;
                    let offStr = row[4] ? row[4].trim() : '';
                    let defStr = row[5] ? row[5].trim() : '';
                    let off = offStr.match(regexVal) ? parseInt(offStr.match(regexVal)[1]) : 0;
                    let def = defStr.match(regexVal) ? parseInt(defStr.match(regexVal)[1]) : 0;
                    
                    let posCode = 'DEF';
                    if(row[2]) {
                        let m = row[2].match(/\[(.*?)\]/);
                        if(m) posCode = m[1].toUpperCase();
                    }

                    let pObj = {
                        num: row[0],
                        name: row[1],
                        pos: posCode,
                        team: assigned,
                        off: off,
                        def: def,
                        goals: 0,
                        isCaptain: false,
                        totalScore: off + def
                    };

                    if(assigned.includes(hMeta.name.toUpperCase())) { hRoster.push(pObj); hStats.off+=off; hStats.def+=def; hStats.count++; }
                    else if(assigned.includes(aMeta.name.toUpperCase())) { aRoster.push(pObj); aStats.off+=off; aStats.def+=def; aStats.count++; }
                });

                // Assign Captains
                if (hRoster.length > 0) hRoster.reduce((max, p) => p.totalScore > max.totalScore ? p : max, hRoster[0]).isCaptain = true;
                if (aRoster.length > 0) aRoster.reduce((max, p) => p.totalScore > max.totalScore ? p : max, aRoster[0]).isCaptain = true;

                // Process Goals from CSV (Cols 9-20)
                let matchEvents = [];
                for(let g=0; g<6; g++) {
                    let minCol = 9 + (g*2);
                    let idCol = 10 + (g*2);
                    if(targetMatch[minCol] && targetMatch[idCol]) {
                        let mn = parseInt(targetMatch[minCol].trim());
                        let pId = targetMatch[idCol].trim();
                        if(!isNaN(mn) && pId) matchEvents.push({ min: mn, id: pId });
                    }
                }
                matchEvents.sort((a,b) => a.min - b.min);

                let allPlayers = [...hRoster, ...aRoster];
                let eventsHtml = '';
                
                if(matchEvents.length === 0) {
                    eventsHtml = `<p style="text-align:center; color:var(--text-muted); font-size:0.85rem; padding:20px;">No timeline events recorded.</p>`;
                } else {
                    eventsHtml = matchEvents.map(ev => {
                        let p = allPlayers.find(pl => pl.num === ev.id);
                        if(p) p.goals++;
                        
                        let isHome = p ? hRoster.includes(p) : true;
                        let teamHex = isHome ? hMeta.hex : aMeta.hex;
                        let textColor = getContrastYIQ(teamHex);
                        let pName = p ? p.name : `Unknown (${ev.id})`;

                        return `
                            <div class="timeline-event ${isHome ? 'home-event' : 'away-event'}">
                                <div class="timeline-half">
                                    <span class="event-minute" style="background:${teamHex}; color:${textColor}; border-color:${teamHex};">${ev.min}'</span>
                                    <span class="event-player">${pName}</span>
                                </div>
                                <div class="timeline-center-icon">⚽</div>
                                <div class="timeline-empty-half"></div>
                            </div>
                        `;
                    }).join('');
                }

                // Win Probability calculation (strict points ratio)
                let hPts = hMeta.points || 0;
                let aPts = aMeta.points || 0;
                let totalPts = hPts + aPts;
                let pHome = 33, pDraw = 34, pAway = 33;
                if (totalPts > 0) {
                    pHome = Math.max(10, Math.round((hPts / totalPts) * 85));
                    pAway = Math.max(10, Math.round((aPts / totalPts) * 85));
                    pDraw = 100 - (pHome + pAway);
                }

                // Build Final DOM
                document.getElementById('app-mount').innerHTML = `
                    <div class="dash-widget scoreboard-outer-card" style="border-left: 4px solid ${hMeta.hex}; border-right: 4px solid ${aMeta.hex};">
                        <div class="scoreboard-bg-gradient" style="background: linear-gradient(135deg, ${hMeta.hex}22 0%, transparent 45%, transparent 55%, ${aMeta.hex}22 100%);"></div>
                        
                        <div class="team-side home-side">
                            <img src="${hLogoUrl}" class="team-logo-lg" onerror="this.style.display='none';">
                            <div>
                                <h2 class="team-name-lg">${hMeta.name}</h2>
                                <p class="team-manager-sm">${hMeta.manager}</p>
                            </div>
                            <div class="team-ladder-rank">RANK: ${hMeta.rank}</div>
                        </div>

                        <div class="score-center-block">
                            <div class="match-meta-badge ${statusClass}">${matchStatus}</div>
                            <div class="score-row">${isFinalised ? (targetMatch[5] || '0') : '-'} <span style="color:var(--text-muted);">:</span> ${isFinalised ? (targetMatch[7] || '0') : '-'}</div>
                            <div class="match-time-label">Week ${queryWeek.toUpperCase()} &bull; ${targetMatch[1] || 'TBA'} &bull; ${targetMatch[2] || 'TBA'}</div>
                        </div>

                        <div class="team-side away-side">
                            <img src="${aLogoUrl}" class="team-logo-lg" onerror="this.style.display='none';">
                            <div>
                                <h2 class="team-name-lg">${aMeta.name}</h2>
                                <p class="team-manager-sm">${aMeta.manager}</p>
                            </div>
                            <div class="team-ladder-rank">RANK: ${aMeta.rank}</div>
                        </div>
                    </div>

                    <div class="dash-widget">
                        <div class="section-title">Algorithmic Win Probability</div>
                        <div class="predictor-labels">
                            <span>${hCode} (${pHome}%)</span>
                            <span>DRAW (${pDraw}%)</span>
                            <span>${aCode} (${pAway}%)</span>
                        </div>
                        <div class="predictor-track-combined">
                            <div class="predictor-segment" style="width: ${pHome}%; background: ${hMeta.hex};"></div>
                            <div class="predictor-segment" style="width: ${pDraw}%; background: rgba(255,255,255,0.1);"></div>
                            <div class="predictor-segment" style="width: ${pAway}%; background: ${aMeta.hex};"></div>
                        </div>
                    </div>

                    ${ytEmbed ? `
                    <div class="dash-widget" style="padding: 16px;">
                        <div class="media-player-wrapper"><iframe src="${ytEmbed}" allowfullscreen></iframe></div>
                    </div>` : ''}

                    <div class="field-grand-wrapper dash-widget" style="padding:0; border-radius: 20px;">
                        <div class="pitch-container-horizontal">
                            <div class="pitch-center-line-vert"></div>
                            <div class="pitch-center-circle-middle"></div>
                            <div class="pitch-center-spot"></div>
                            <div class="pitch-penalty-box-left"></div>
                            <div class="pitch-goal-box-left"></div>
                            <div class="pitch-penalty-box-right"></div>
                            <div class="pitch-goal-box-right"></div>
                            
                            <div class="pitch-team-half home-left-side">
                                ${buildHorizontalPitchNodes(hRoster, hMeta.hex, getContrastYIQ(hMeta.hex))}
                            </div>
                            <div class="pitch-team-half away-right-side">
                                ${buildHorizontalPitchNodes(aRoster, aMeta.hex, getContrastYIQ(aMeta.hex))}
                            </div>
                        </div>
                        
                        <div class="integrated-performance-hud">
                            <div>
                                <div class="stat-labels"><span>Offensive Rating</span><span class="stat-val-highlight">${hStats.count ? Math.round(hStats.off/hStats.count*10)/10 : 0}</span></div>
                                <div class="stat-split-track"><div style="width: ${hStats.count ? (hStats.off/hStats.count)*10 : 0}%; background: #34d399;"></div></div>
                            </div>
                            <div>
                                <div class="stat-labels"><span>Offensive Rating</span><span class="stat-val-highlight">${aStats.count ? Math.round(aStats.off/aStats.count*10)/10 : 0}</span></div>
                                <div class="stat-split-track"><div style="width: ${aStats.count ? (aStats.off/aStats.count)*10 : 0}%; background: #34d399; margin-left: auto;"></div></div>
                            </div>
                            <div>
                                <div class="stat-labels"><span>Defensive Rating</span><span class="stat-val-highlight">${hStats.count ? Math.round(hStats.def/hStats.count*10)/10 : 0}</span></div>
                                <div class="stat-split-track"><div style="width: ${hStats.count ? (hStats.def/hStats.count)*10 : 0}%; background: #60a5fa;"></div></div>
                            </div>
                            <div>
                                <div class="stat-labels"><span>Defensive Rating</span><span class="stat-val-highlight">${aStats.count ? Math.round(aStats.def/aStats.count*10)/10 : 0}</span></div>
                                <div class="stat-split-track"><div style="width: ${aStats.count ? (aStats.def/aStats.count)*10 : 0}%; background: #60a5fa; margin-left: auto;"></div></div>
                            </div>
                        </div>
                    </div>

                    <div class="dash-widget">
                        <div class="section-title" style="text-align: center; border-bottom:0;">Match Events Timeline</div>
                        <div class="timeline-container">
                            <div class="timeline-line"></div>
                            ${eventsHtml}
                        </div>
                    </div>

                    <div class="dash-widget roster-lists">
                        <div>
                            <div class="section-title" style="color: ${hMeta.hex}; display:flex; align-items:center; gap:8px;">
                                <div style="width:12px; height:12px; background:${hMeta.hex}; border-radius:50%;"></div> ${hCode} Squad
                            </div>
                            ${buildRosterTable(hRoster)}
                        </div>
                        <div>
                            <div class="section-title" style="color: ${aMeta.hex}; display:flex; align-items:center; gap:8px;">
                                <div style="width:12px; height:12px; background:${aMeta.hex}; border-radius:50%;"></div> ${aCode} Squad
                            </div>
                            ${buildRosterTable(aRoster)}
                        </div>
                    </div>
                `;
            } catch (err) {
                document.getElementById('app-mount').innerHTML = `
                    <div style="text-align:center; padding: 60px 20px; color: #ef4444; border: 1px dashed rgba(239, 68, 68, 0.4); border-radius: 12px; background: rgba(239, 68, 68, 0.05);">
                        <h3 style="margin-top:0;">CRITICAL ENGINE FAILURE</h3>
                        <p style="font-family:monospace; margin-bottom:0;">${err.message}</p>
                    </div>`;
                console.error(err);
            }
        }

        window.addEventListener('DOMContentLoaded', bootApp);
    </script>
</body>
</html>
